name: Publish source and Windows launcher preview

on:
  push:
    branches: [main]
    paths:
      - ".github/release-version.txt"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate quest data
        run: python scripts/validate_quests.py
      - name: Prepare release archives and notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-version.txt)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          mkdir -p dist
          SOURCE="dist/AeonArk-${VERSION}-Source.zip"
          LAUNCHER="dist/AeonArk-${VERSION}-Windows-Launcher.zip"
          git archive --format=zip --prefix="aeon-ark-lost-frontier-${VERSION}/" HEAD -o "$SOURCE"
          git archive --format=zip --prefix="aeon-ark-windows-launcher-${VERSION}/" HEAD launcher scripts config global_packs quest-data modpack_sources.json pack_manifest.json Build_PCL整合包.bat README_先看这里.md -o "$LAUNCHER"
          cat > dist/release-notes.md <<EOF
          # Aeon Ark: The Lost Frontier v${VERSION}

          **Windows launcher + source engineering preview** for Minecraft Java 26.3 + Fabric.

          ## Release assets
          - **Windows-Launcher.zip** — portable PowerShell GUI launcher. Extract the ZIP, open the launcher folder, and double-click Start-AeonArk.bat.
          - **Source.zip** — full editable project source and quest data.

          ## Launcher features
          - One-click build/download of compatible Modrinth files with hash verification.
          - Guided installation of mods, config and Global Packs into an existing Fabric 26.3 instance.
          - Open PCL/PCL2, with manual executable selection if auto-detection fails.
          - Does not modify or delete worlds/saves.

          ## Requirements and limitations
          - Windows 10/11, PowerShell 5.1, internet for first build, Java 25 x64, and an already-installed Minecraft 26.3 + Fabric 0.20.1 instance.
          - The launcher does not yet install Minecraft/Fabric or automatically start the game instance.
          - This remains an engineering preview, not a client-tested ready-to-play release. Island spawn, quest tracking and 5 GB performance still require in-game validation.
          - Back up existing worlds before testing. Use a fresh instance and a new world.
          EOF
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "launcher=$LAUNCHER" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aeon Ark v${{ steps.release.outputs.version }} — Launcher Preview
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}
          draft: false
          overwrite_files: true
          files: |
            ${{ steps.release.outputs.source }}
            ${{ steps.release.outputs.launcher }}
          body_path: dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
