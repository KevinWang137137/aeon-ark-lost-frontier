name: Publish source-only preview release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-version.txt"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-source-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate quest data
        run: python scripts/validate_quests.py

      - name: Prepare source archive and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-version.txt)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Invalid alpha version: $VERSION" >&2
            exit 1
          fi

          mkdir -p dist
          ARCHIVE="dist/AeonArk-${VERSION}-Source.zip"
          git archive --format=zip --prefix="aeon-ark-lost-frontier-${VERSION}/" HEAD -o "$ARCHIVE"

          cat > dist/release-notes.md <<EOF
          # Aeon Ark: The Lost Frontier v${VERSION}

          **Source-only engineering preview** for Minecraft Java 26.3 + Fabric.

          ## Included
          - 72 original Chinese quest definitions in 8 categories (stored as a compact source bundle).
          - PCL-oriented Windows build scripts and Modrinth dependency/hash resolution.
          - Instance-scoped Global Packs and JustQuests configuration.
          - Optional Terralith world-generation datapack; it is not enabled by default so the island start can be tested separately.

          ## Validation
          - Quest JSON, objective/reward fields and prerequisite references pass the repository validator.
          - GitHub Actions must complete the validation job successfully before this Release is created.

          ## Important limitations
          - This asset is source code and authored game data, **not a prebuilt playable modpack**.
          - Third-party mod JARs are not included. Run `Build_PCL整合包.bat` on an internet-connected Windows PC to resolve and verify compatible files.
          - Windows PowerShell build execution, PCL import, Minecraft client launch, island spawn, in-game quest tracking, and 5 GB performance tests have not yet been completed.
          - The island seed is a candidate and is not claimed to have been verified.

          Use Java 25 x64 and test in a fresh PCL instance. Do not use this alpha build as the only copy of an existing world.
          EOF

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aeon Ark v${{ steps.release.outputs.version }} — Source Preview
          prerelease: true
          draft: false
          files: ${{ steps.release.outputs.archive }}
          body_path: dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
