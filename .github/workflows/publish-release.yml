name: Build PCL modpack ZIP and publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-version.txt"
      - ".github/workflows/publish-release.yml"
      - "scripts/**"
      - "modpack_sources.json"
      - "config/**"
      - "global_packs/**"
      - "quests/**"
      - "quest_bundle/**"
      - "pack_manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PCL-importable pack
        shell: pwsh
        run: |
          ./scripts/build_pack.ps1

      - name: Read release version and verify single deliverable
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content .github/release-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          $pack = "release/AeonArk-26.3-Fabric-v$version.zip"
          if (!(Test-Path $pack)) { throw "Pack ZIP not found: $pack" }
          $files = @(Get-ChildItem release -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne (Split-Path $pack -Leaf)) {
            throw "Release folder must contain exactly one deliverable ZIP."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "pack=$pack" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aeon Ark - The Lost Frontier v${{ steps.release.outputs.version }}
          prerelease: true
          draft: false
          overwrite_files: true
          files: ${{ steps.release.outputs.pack }}
          body: |
            # Aeon Ark: The Lost Frontier v${{ steps.release.outputs.version }}

            PCL 可直接导入的单 ZIP 整合包。

            ## 安装
            1. 下载本页唯一的 AeonArk-26.3-Fabric ZIP。
            2. 将 ZIP 文件直接拖入 PCL 窗口，按提示创建独立游戏版本。
            3. 首次安装需要联网；ZIP 已内置所有实际模组 JAR、配置、任务和数据包；PCL 仅需按 MMC 组件信息安装 Minecraft/Fabric 本体与运行库。
            4. 使用 Java 25 x64，建议先分配 5GB 内存。
            5. 安装完成后创建新世界进行测试；不要用测试版覆盖已有存档。

            ZIP 根目录包含 mmc-pack.json 与 instance.cfg；完整客户端内容位于 .minecraft/，实际模组 JAR 已打包，不需要逐个下载。
            本版仍为预览版；世界出生点、任务计数和长时间稳定性需要实际游戏验收。
