name: Build PCL modpack ZIP and publish release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-version.txt"
      - ".github/workflows/publish-release.yml"
      - "scripts/**"
      - "modpack_sources.json"
      - "config/**"
      - "global_packs/**"
      - "resourcepacks/**"
      - "quests/**"
      - "quest_bundle/**"
      - "pack_manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PCL-importable pack
        shell: pwsh
        run: ./scripts/build_pack.ps1

      - name: Verify release deliverable
        id: release
        shell: pwsh
        run: |
          $version = (Get-Content .github/release-version.txt -Raw).Trim()
          if ($version -ne '1.0.0') { throw "Expected release version 1.0.0, got $version" }
          $pack = "release/AeonArk-26.3-Fabric-v$version.zip"
          if (!(Test-Path $pack)) { throw "Pack ZIP not found: $pack" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $pack))
          try {
            $mods = @($zip.Entries | Where-Object { $_.FullName -match '^\.minecraft/mods/[^/]+\.jar$' })
            if ($mods.Count -lt 150) { throw "Only $($mods.Count) actual JARs in release ZIP; minimum is 150." }
            if ($null -eq $zip.GetEntry('.minecraft/resourcepacks/AeonArk_Title_Logo/assets/minecraft/textures/gui/title/minecraft.png')) { throw "AEON ARK title texture missing." }
            if ($null -eq $zip.GetEntry('.minecraft/resourcepacks/AeonArk_Title_Logo/pack.mcmeta')) { throw "Title resource-pack metadata missing." }
            $options = $zip.GetEntry('.minecraft/options.txt')
            if ($null -eq $options) { throw "options.txt missing." }
            $reader = [System.IO.StreamReader]::new($options.Open())
            try { $optionText = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($optionText -notmatch 'file/AeonArk_Title_Logo') { throw "Title logo is not configured as enabled." }
          } finally { $zip.Dispose() }
          $mrpack = "release/AeonArk-26.3-Fabric-v$version.mrpack"
          if (!(Test-Path $mrpack)) { throw "Modrinth pack not found: $mrpack" }
          $mr = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $mrpack))
          try {
            $indexEntry = $mr.GetEntry("modrinth.index.json")
            if ($null -eq $indexEntry) { throw "MRPACK index missing." }
            $reader = [System.IO.StreamReader]::new($indexEntry.Open())
            try { $index = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
            if ($index.formatVersion -ne 1 -or $index.game -ne "minecraft") { throw "Invalid Modrinth index." }
            if ($index.dependencies.minecraft -ne "26.3" -or $index.dependencies."fabric-loader" -ne "0.20.1") { throw "MRPACK dependency versions mismatch." }
            if (@($index.files).Count -lt 150) { throw "MRPACK has fewer than 150 mod references." }
            if ($null -eq $mr.GetEntry("overrides/resourcepacks/AeonArk_Title_Logo/pack.mcmeta")) { throw "MRPACK title resource pack missing." }
          } finally { $mr.Dispose() }
          $files = @(Get-ChildItem release -File)
          if ($files.Count -ne 2 -or !(Test-Path $pack) -or !(Test-Path $mrpack)) { throw "Release folder must contain exactly the PCL ZIP and Modrinth MRPACK." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "pack=$pack" >> $env:GITHUB_OUTPUT
          "mrpack=$mrpack" >> $env:GITHUB_OUTPUT
          "jar_count=$($mods.Count)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aeon Ark - The Lost Frontier v${{ steps.release.outputs.version }}
          prerelease: false
          draft: false
          overwrite_files: true
          make_latest: true
          files: |
            ${{ steps.release.outputs.pack }}
            ${{ steps.release.outputs.mrpack }}
          body: |
            # Aeon Ark: The Lost Frontier v1.0.0

            **正式发行版 · Minecraft Java 26.3 · Fabric · PCL ZIP + Modrinth MRPACK**

            ## 本版验收
            - Windows CI 从 Modrinth 按 Minecraft 26.3 + Fabric 条件自动发现模组与依赖。
            - 至少 150 个实际 .jar 已下载、逐个哈希校验，并确认真实装入发布 ZIP。
            - 发布包内含 AEON ARK 标题 Logo 资源包，options.txt 已配置在新实例中默认启用。
            - PCL ZIP 与 Modrinth MRPACK 双格式均由发布工作流构建和检查；MRPACK 使用 Modrinth 文件 CDN URL 与 SHA 哈希引用模组，配置和资源包放入 overrides。

            ## 安装
            1. PCL 用户下载 AeonArk-26.3-Fabric-v1.0.0.zip；Modrinth 发布使用同版本 .mrpack 文件。
            2. 将 ZIP 拖入 PCL，导入为独立实例。
            3. 首次安装保持联网，让 PCL 安装 Minecraft/Fabric 本体和运行库。
            4. 使用 Java 25 x64；内存建议先分配 5GB。
            5. 创建新世界测试，不要覆盖已有存档。

            ## 验证边界
            自动化已验证实际 JAR 数量、下载哈希、ZIP 内容和标题资源包默认启用配置。当前自动化环境未完成真实桌面客户端的人工视觉验收；标题 Logo 已按 Minecraft 26.3 资源包格式打包，但请在首次启动后确认主菜单显示效果。150 个模组的内存占用和模组间运行稳定性仍需在目标电脑上实测.
